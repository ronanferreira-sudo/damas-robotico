[project]
name = "damas"
version = "0.1.0"
description = "Sistema de damas jogado por I.A. com dois bracos roboticos Dobot Magician Lite e visao computacional."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydraughts>=0.6.7",
    "opencv-python>=4.7",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydobot>=1.3.0",
    "pyserial==3.4",
    "websockets>=11.0",
    "pillow>=9.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
damas = "damas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
